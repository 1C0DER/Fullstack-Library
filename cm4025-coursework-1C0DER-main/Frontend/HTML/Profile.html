<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="/CSS/main.css">
</head>
<body>
    <header>
        <h1><a href="/HTML/stories.html"><img class="book" src="/Images/book-icon.png" alt="book">Profile</a></h1>

        <div class="right-side">
            <nav>
                <ul>
                    <li><a href="/HTML/AuthorRank.html">Author Ranking</a></li>
                    <li><a href="/HTML/StoryRank.html">Story Ranking</a></li>
                    <li><a href="/HTML/StorySubmit.html">Submit a Story</a></li>
                </ul>
            </nav>

            <div class="profile">
                <img src="/Images/icon.png" alt="Profile" class="profile-icon" id="profile-icon">
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="/HTML/Profile.html">Profile</a>
                    <a href="/HTML/Login.html">Login</a>
                    <a href="/HTML/SignUp.html">Sign Up</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="user-info">
            <h2>Welcome, <span id="user-name">John Doe</span></h2>
        </section>

        <!-- Allows user to view/update their status -->
        <section class="user-status">
            <h2>Your Status</h2>
            <p id="status-text"><strong>Status: </strong><span id="status">Loading...</span></p>
            <div>
                <!-- Radio buttons to select status -->
                <label><input type="radio" name="status" value="author" id="author-radio"> Author</label><br>
                <label><input type="radio" name="status" value="reader" id="reader-radio"> Reader</label><br>
                <label><input type="radio" name="status" value="both" id="both-radio"> Author & Reader</label><br>
            </div>
            <button onclick="updateStatus()">Update Status</button>
        </section>

        <section class="user-stories">
            <h2>Your Submitted Stories</h2>
            <ul id="user-story-list">
                <!-- User's stories will be inserted here dynamically -->
            </ul>
        </section>

        <!-- Add a logout button -->
        <div class="auth-buttons">
            <button id="logout-btn">Log Out</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Microfiction Library</p>
    </footer>

    <script src="/JS/storydetail.js"></script>

    <!-- Inline script for authentication and story fetching -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('token');  // Get the token from localStorage

            if (!token) {
                // If no token, redirect to login
                window.location.href = '/HTML/Login.html';
            } else {
                // Fetch the user's stories from the backend
                fetch('/api/userStories', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(stories => {
                    const storyList = document.getElementById('user-story-list');
                    if (stories.length === 0) {
                        storyList.innerHTML = '<li>No stories found.</li>';
                    } else {
                        // Display each story as a list item
                        stories.forEach(story => {
                            const storyItem = document.createElement('li');
                            storyItem.innerHTML = `
                                <h3>${story.title}</h3>
                                <p><strong>Genre:</strong> ${story.genre}</p>
                                <p><strong>Status:</strong> ${story.visibility}</p>
                                <p><strong>Username:</strong> ${story.username}</p>
                                <p><strong>Content:</strong> ${story.content}</p>
                                <p><strong>Rating:</strong> ${story.rating} | <strong>Votes:</strong> ${story.ratingCount}</p>
                                <button onclick="deleteStory('${story._id}')">Delete</button>
                            `;
                            storyList.appendChild(storyItem);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching stories:', error);
                    alert('Error fetching stories');
                });
            }
        });

        // Function to handle the logout
        document.getElementById('logout-btn').addEventListener('click', function () {
            // Remove the token from localStorage
            localStorage.removeItem('token');
            
            // Redirect the user to the login page
            window.location.href = '/HTML/Login.html';
        });

        // Function to delete a story
        function deleteStory(storyId) {
            if (confirm('Are you sure you want to delete this story?')) {
                const token = localStorage.getItem('token');

                fetch('/api/deleteStory', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ storyId })
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    location.reload();  // Refresh the page to remove the deleted story
                })
                .catch(error => {
                    console.error('Error deleting story:', error);
                    alert('Error deleting story');
                });
            }
        }

        // Function to update user status (Optional)
        function updateStatus() {
            const authorRadio = document.getElementById('author-radio');
            const readerRadio = document.getElementById('reader-radio');
            const bothRadio = document.getElementById('both-radio');

            let status = '';  // Declare the status variable here

            // Ensure at least one radio button is selected
            if (authorRadio.checked) {
                status = 'author';
            } else if (readerRadio.checked) {
                status = 'reader';
            } else if (bothRadio.checked) {
                status = 'both';
            } else {
                alert('Please select a status.');
                return;  // Exit if no status is selected
            }

            const token = localStorage.getItem('token');

            if (!token) {
                alert('Please log in to update your status');
                return;
            }

            const userData = JSON.parse(atob(token.split('.')[1]));  // Decode token to get user data
            const userId = userData.userId;  // User's ID from the token

            // Prepare the new status data to be sent to the backend
            const statusData = {
                userId,
                status
            };

            fetch('/api/updateStatus', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(statusData)  // Send the status update
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Status updated successfully!');
                    document.getElementById('status').textContent = status;  // Update status on profile page
                } else {
                    alert('Error updating status');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error updating status');
            });
        }
    </script>
</body>
</html>
