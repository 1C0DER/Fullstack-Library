<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/CSS/main.css">
</head>
<body>
    <header>
        <h1><a href="/HTML/stories.html"><img class="book" src="/Images/book-icon.png" alt="book">Create an Account</a></h1>

        <div class="right-side">
            <nav>
                <ul>
                    <li><a href="/HTML/AuthorRank.html">Author Ranking</a></li>
                    <li><a href="/HTML/StoryRank.html">Story Ranking</a></li>
                    <li><a href="/HTML/StorySubmit.html">Submit a Story</a></li>
                </ul>
            </nav>

            <div class="profile">
                <img src="/Images/icon.png" alt="Profile" class="profile-icon" id="profile-icon">
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="/HTML/Profile.html">Profile</a>
                    <a href="/HTML/Login.html">Login</a>
                    <a href="/HTML/SignUp.html">Sign Up</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <form id="signup-form" onsubmit="event.preventDefault(); submitSignUp();">
            <h2>Sign Up</h2>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        
            <small id="passwordHelp" style="display:none; color:red;">Password must be at least 8 characters long, contain one uppercase letter, one number, and one special character.</small>
        
            <label for="role">Role:</label>
            <!-- Role selection (radio buttons) -->
            <div id="role-container">
                <label for="author">Author</label>
                <input type="radio" id="author" name="role" value="author">

                <label for="reader">Reader</label>
                <input type="radio" id="reader" name="role" value="reader">

                <label for="both">Both</label>
                <input type="radio" id="both" name="role" value="both">
            </div>

            <button type="submit">Sign Up</button>
        </form>              
    </main>

    <footer>
        <p>&copy; 2025 Microfiction Library</p>
    </footer>

    <script src=/JS/storydetail.js></script>
</body>
</html>
